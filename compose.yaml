name: fine-tuning-of-advertising

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  backend:
    image: nginx:1.28-alpine
    volumes:
      - ./frontend/docker/api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
