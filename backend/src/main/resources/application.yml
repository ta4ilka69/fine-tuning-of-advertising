server:
  port: 8000
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: adtune-backend
  servlet:
    multipart:
      # чуть выше бизнес-лимита 15 МБ: сам файл плюс поля формы
      max-file-size: 16MB
      max-request-size: 17MB
  datasource:
    # Схема создаётся SQL из infra/db при первом старте тома postgres (compose).
    # stringtype=unspecified: строки уходят без типа, и PostgreSQL сам приводит их
    # к enum- и jsonb-колонкам схемы.
    url: ${DB_URL:jdbc:postgresql://db:5432/advertising?stringtype=unspecified}
    username: ${DB_USER:advertising}
    password: ${DB_PASSWORD:advertising}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10

# Каталог хранилища фотографий (в compose — том /photos).
photo:
  dir: ${PHOTO_DIR:photos}

adtune:
  ai:
    provider: ${AI_PROVIDER:openai}
    timeout: ${AI_TIMEOUT:50s}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-mini}
      # Глубина «размышлений» gpt-5: меньше — быстрее и дешевле. Пусто = не отправлять.
      reasoning-effort: ${OPENAI_REASONING_EFFORT:low}

logging:
  level:
    com.adtune: INFO
