server:
  port: 8000
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: adtune-backend
  servlet:
    multipart:
      # чуть выше бизнес-лимита 15 МБ: сам файл плюс поля формы
      max-file-size: 16MB
      max-request-size: 17MB
  datasource:
    # Схема создаётся SQL из infra/db при первом старте тома postgres (compose).
    # stringtype=unspecified: строки уходят без типа, и PostgreSQL сам приводит их
    # к enum- и jsonb-колонкам схемы.
    url: ${DB_URL:jdbc:postgresql://db:5432/advertising?stringtype=unspecified}
    username: ${DB_USER:advertising}
    password: ${DB_PASSWORD:advertising}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10

# Каталог хранилища фотографий (в compose — том /photos).
photo:
  dir: ${PHOTO_DIR:photos}

adtune:
  # false — фоновые AI-задачи выполняются в потоке запроса (для тестов).
  ai-tasks:
    async: ${AI_TASKS_ASYNC:true}
  ai:
    provider: ${AI_PROVIDER:openai}
    timeout: ${AI_TIMEOUT:50s}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      # Модель и глубина размышлений настраиваются отдельно под генерацию
      # объявлений и обработку фото; общие OPENAI_MODEL / OPENAI_REASONING_EFFORT
      # остаются фолбэком для обоих. Пустой effort = не отправлять параметр.
      generation:
        model: ${OPENAI_GENERATION_MODEL:${OPENAI_MODEL:gpt-5-mini}}
        reasoning-effort: ${OPENAI_GENERATION_REASONING_EFFORT:${OPENAI_REASONING_EFFORT:low}}
      photo:
        model: ${OPENAI_PHOTO_MODEL:${OPENAI_MODEL:gpt-5-mini}}
        reasoning-effort: ${OPENAI_PHOTO_REASONING_EFFORT:${OPENAI_REASONING_EFFORT:low}}

logging:
  level:
    com.adtune: INFO
